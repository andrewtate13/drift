<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#ddd3ea;--dim:#958da6;--faint:#5f596e;--acc:#b89cff}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);cursor:none;
    font-family:'Instrument Serif',Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased}
  body.pointer{cursor:default}
  #keep,#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block;background:#000}
  #keep{z-index:0;object-fit:cover}
  #gl{z-index:1}
  .layer{position:fixed;left:0;top:0;will-change:transform,opacity}
  .mono{font-family:'JetBrains Mono',Menlo,'DejaVu Sans Mono',monospace}

  /* now-playing card */
  #card{z-index:4;display:flex;align-items:center;opacity:0;transition:opacity 2.5s ease}
  #card.show{opacity:1}
  #card.show.paused{opacity:.42}
  .art{position:relative;width:13vw;height:13vw;flex:none;margin-right:2.2vw}
  .art img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;border-radius:.25vw;opacity:0;
    transition:opacity 2.2s ease;box-shadow:0 1.6vw 4vw rgba(0,0,0,.75)}
  .art img.on{opacity:.9}
  .art canvas{position:absolute;left:-45%;top:-45%;width:190%;height:190%;opacity:.45;transition:opacity 2s;
    -webkit-mask-image:radial-gradient(closest-side,#000 25%,transparent);mask-image:radial-gradient(closest-side,#000 25%,transparent)}
  .meta{width:24vw;transition:opacity .8s ease}
  .meta.swap{opacity:0}
  .kick{font-size:.7vw;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .title{font-size:3vw;line-height:1.02;font-style:italic;color:var(--ink);margin:.45vw 0 .5vw;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .artist{font-size:1.55vw;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .album{font-size:.75vw;color:var(--faint);margin-top:.55vw;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar{position:relative;height:2px;background:rgba(255,255,255,.07);margin-top:1.1vw;width:20vw;overflow:hidden;border-radius:2px}
  .bar i{position:absolute;left:0;top:0;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--acc);opacity:.65}
  .times{font-size:.68vw;color:var(--faint);margin-top:.45vw;display:flex;justify-content:space-between;width:20vw}

  /* synced lyrics: smoke that appears somewhere new for every line */
  .lyr{z-index:3;font-style:italic;font-size:3.4vw;line-height:1.08;max-width:44vw;color:var(--acc);opacity:0;
    transition:opacity 1.8s ease;text-shadow:0 0 2.5vw rgba(0,0,0,.7)}
  .lyr.on{opacity:.5}

  #toast{z-index:6;font-size:.8vw;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);opacity:0;transition:opacity .9s ease;white-space:nowrap}
  #toast.on{opacity:.85}

  /* setup + help panel */
  #panel{z-index:7;width:38vw;padding:2vw 2.2vw;box-sizing:border-box;background:rgba(5,3,9,.72);
    border:1px solid rgba(160,140,200,.14);border-radius:.4vw;font-size:1.15vw;line-height:1.45;opacity:0;transition:opacity .8s;pointer-events:none}
  #panel.on{opacity:1;pointer-events:auto}
  #panel h1{font-weight:normal;font-style:italic;font-size:3.4vw;line-height:1;margin:.1em 0 .35em;color:var(--ink)}
  #panel .k{font-size:.7vw;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
  #panel p{margin:.5em 0;color:var(--dim)}
  #panel .m{font-family:'JetBrains Mono',Menlo,monospace;font-size:.78vw;color:var(--dim)}
  #panel .err{color:#c48a96}
  #panel .btn{display:inline-block;margin:.9em 1em 0 0;padding:.35em 1em;border:1px solid rgba(170,150,210,.25);border-radius:.3em;color:var(--dim);cursor:pointer}
  #panel .btn.focus{border-color:var(--acc);color:var(--ink);background:rgba(150,110,210,.14)}
  #panel input{font:inherit;font-family:'JetBrains Mono',Menlo,monospace;font-size:.9vw;width:100%;box-sizing:border-box;margin-top:.6em;
    padding:.4em .6em;background:rgba(0,0,0,.6);color:var(--ink);border:1px solid rgba(170,150,210,.3);border-radius:.3em}
  #panel .qrwrap{display:flex;align-items:center;margin:.9em 0 .3em}
  #panel #qr{width:11vw;height:11vw;flex:none;margin-right:1.4vw;border-radius:.3vw;background:#b9b1c6;image-rendering:pixelated}
  @media (max-width:820px){ /* phone, during the pairing hand-off */
    #panel{width:88vw;font-size:4.2vw;padding:6vw}
    #panel h1{font-size:11vw}
    #panel .k{font-size:2.6vw}
    #panel .m{font-size:3vw}
    #panel .btn{padding:.5em 1.1em}
  }
  #panel table{border-collapse:collapse;margin:.4em 0}
  #panel td{padding:.15em 1.2em .15em 0;color:var(--dim);vertical-align:top}
  #panel td:first-child{font-family:'JetBrains Mono',Menlo,monospace;font-size:.75vw;color:var(--faint);white-space:nowrap;padding-top:.35em}
</style>
</head>
<body>
<video id="keep" src="loop.mp4" muted loop playsinline autoplay></video>
<canvas id="gl"></canvas>
<div id="lyrA" class="layer lyr"></div>
<div id="lyrB" class="layer lyr"></div>
<div id="card" class="layer">
  <div class="art"><canvas id="glow" width="20" height="20"></canvas><img id="artA" alt=""><img id="artB" alt=""></div>
  <div class="meta" id="meta">
    <div class="kick mono" id="kick"></div>
    <div class="title" id="title"></div>
    <div class="artist" id="artist"></div>
    <div class="album mono" id="album"></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="times mono"><span id="tNow">0:00</span><span id="tDur">0:00</span></div>
  </div>
</div>
<div id="toast" class="layer mono"></div>
<div id="panel" class="layer"></div>
<noscript>Drift needs JavaScript.</noscript>

<script>
(function () {
  'use strict';

  /* ======================================================================
     Drift: burn-in-safe Spotify visuals for an LG OLED (webOS browser).
     Paste your Spotify app's Client ID here (or open the page with ?cid=...).
     ====================================================================== */
  var CLIENT_ID = '920936ac2495460dbfb5f24ff4638f69';

  var SCOPES = 'user-read-currently-playing user-read-playback-state user-modify-playback-state streaming user-read-email user-read-private';
  var AUTO_SCENE_MS = 7 * 60 * 1000;      // auto-cycle scenes
  var PAUSE_HIDE_MS = 90 * 1000;          // paused: hide card after this
  var IDLE_DIM_MS = 10 * 60 * 1000;       // nothing playing: dim visuals after this
  var IDLE_SLEEP_MS = 30 * 60 * 1000;     // nothing playing: let the TV sleep after this

  var $ = function (id) { return document.getElementById(id); };
  function clamp(x, a, b) { return x < a ? a : x > b ? b : x; }
  function mmss(ms) { var s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var TAU = Math.PI * 2;

  /* ---------- storage ---------- */
  var LS = {
    get: function (k) { try { return localStorage.getItem('drift.' + k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem('drift.' + k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem('drift.' + k); } catch (e) {} },
    clear: function () { try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf('drift.') === 0) localStorage.removeItem(k); }); } catch (e) {} }
  };
  var Q = new URLSearchParams(location.search);
  var REDIRECT = location.origin + location.pathname.replace(/index\.html$/, '');
  if (Q.has('reset')) { LS.clear(); }
  if (Q.get('cid')) LS.set('cid', Q.get('cid').trim());
  var cid = CLIENT_ID || LS.get('cid') || '';
  var DEMO = Q.has('demo');

  /* ---------- keep-awake: a real video must be playing full screen (tested on the TV: T6) ---------- */
  var keep = $('keep'), wantAwake = true;
  function keepPlay() { if (!wantAwake) return; try { var p = keep.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  keep.addEventListener('pause', function () { if (wantAwake) setTimeout(keepPlay, 600); });
  setInterval(function () { if (wantAwake && keep.paused) keepPlay(); }, 10000);
  function setAwake(on) { if (on === wantAwake) return; wantAwake = on; if (on) keepPlay(); else try { keep.pause(); } catch (e) {} }

  /* ======================================================================
     WebGL scenes. All cheap enough for a Mali-G51 at ~1/3 resolution.
     ====================================================================== */
  var HEAD = [
    '#ifdef GL_FRAGMENT_PRECISION_HIGH', 'precision highp float;', '#else', 'precision mediump float;', '#endif',
    'uniform vec2 uR; uniform float uT; uniform float uFade; uniform float uPulse; uniform float uDim;',
    'uniform vec3 uC0; uniform vec3 uC1; uniform vec3 uC2; uniform vec3 uC3; uniform vec3 uC4; uniform sampler2D uTex;',
    'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
    'float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
    ' return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}',
    'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p=p*2.07+vec2(1.7,9.2);a*=.5;}return v;}',
    'vec2 UV(){return (gl_FragCoord.xy-.5*uR)/uR.y;}',
    'vec3 fin(vec3 c,vec2 uv){',
    ' c*=1.-smoothstep(.25,1.4,length(uv*vec2(.78,1.)));',
    ' c*=(1.+uPulse*.35)*uFade*uDim;',
    ' c+=(h(gl_FragCoord.xy+fract(uT*.37))-.5)/255.;',
    ' return max(c,0.);}'
  ].join('\n');

  // 1. Nebula: domain-warped smoke in the cover's colours.
  var NEBULA = [
    'void main(){vec2 uv=UV();float t=uT*.018;',
    ' vec2 q=vec2(fbm(uv*1.25+vec2(0.,t)),fbm(uv*1.25+vec2(5.2,1.3)-t));',
    ' float f=fbm(uv*1.05+1.9*q+vec2(t*.6,-t*.4));',
    ' float body=smoothstep(.3,.82,f);',
    ' vec3 c=uC0;',
    ' c+=uC1*body*body*.95;',
    ' c+=uC2*smoothstep(.6,1.1,length(q))*body*.55;',
    ' c+=uC3*pow(smoothstep(.62,.95,f),4.)*1.1;',
    ' c+=uC4*pow(max(0.,q.x-q.y)*2.,3.)*.3;',
    ' c*=.35+.65*smoothstep(.2,.55,f);',
    ' gl_FragColor=vec4(fin(c,uv),1.);}'
  ].join('\n');

  // 2. Eclipse: a wandering black disc with a corona. Mostly true black (OLED-friendly).
  var ECLIPSE = [
    'void main(){vec2 uv=UV();float t=uT;',
    ' vec2 ctr=vec2(.30*sin(t*.011)+.09*sin(t*.027),.15*cos(t*.009)+.05*sin(t*.031));',
    ' vec2 p=uv-ctr;float r=length(p);',
    ' float R=.25+.015*sin(t*.07)+uPulse*.03;',
    ' vec2 dir=p/max(r,.001);',
    ' float rays=fbm(dir*2.2+vec2(t*.02,-t*.015)+r*1.4);',
    ' float fine=fbm(dir*6.+vec2(-t*.03,t*.012));',
    ' float o=max(r-R,0.);',
    ' float cor=exp(-o*(6.-3.*rays));',
    ' vec3 c=uC0*.6*(1.-smoothstep(0.,1.3,r));',
    ' c+=mix(uC1,uC2,smoothstep(.3,.7,rays))*cor*(.25+1.3*rays*fine);',
    ' c+=uC3*exp(-abs(r-R)*85.)*.55;',
    ' c+=uC4*exp(-abs(r-R*1.9-.04*sin(t*.05))*40.)*.08*fine;',
    ' c*=smoothstep(R-.003,R+.005,r)*.985+.015;',
    ' gl_FragColor=vec4(fin(c,uv),1.);}'

  // 3. Silk: slow aurora ribbons with hanging curtains.
  var SILK = [
    'void main(){vec2 uv=UV();float t=uT*.05;',
    ' vec3 c=uC0*.7;',
    ' for(int i=0;i<4;i++){float fi=float(i);',
    '  vec3 col=i==0?uC1:(i==1?uC2:(i==2?uC3:uC4));',
    '  float y=(fi-1.5)*.17+.22*sin(uv.x*(.9+fi*.23)+t*(1.+fi*.31)+fi*2.1)+.35*(n(vec2(uv.x*1.1+fi*3.7,t*.6+fi))-.5);',
    '  float d=uv.y-y;',
    '  float core=exp(-d*d*170.);',
    '  float halo=exp(-abs(d)*9.)*.2;',
    '  float curtain=exp(-max(d,0.)*3.2)*step(0.,d)*.1;',
    '  float sh=.5+.5*n(vec2(uv.x*7.+fi*11.,t*3.));',
    '  c+=col*(core*.5+halo+curtain)*sh;',
    ' }',
    ' gl_FragColor=vec4(fin(c,uv),1.);}'
  ].join('\n');

  // 4. Melt: the album cover itself, liquified and smeared into the dark.
  var MELT = [
    'void main(){vec2 uv=UV();float t=uT*.02;',
    ' vec2 w=vec2(fbm(uv*1.6+vec2(t,0.)),fbm(uv*1.6+vec2(3.1,7.7)-vec2(0.,t)))-.5;',
    ' float a=t*.35;mat2 m=mat2(cos(a),-sin(a),sin(a),cos(a));',
    ' vec2 tc=m*(uv*.62)+w*(.38+uPulse*.2)+.5;',
    ' vec3 s=texture2D(uTex,tc).rgb*.5+texture2D(uTex,tc+w*.06).rgb*.3+texture2D(uTex,tc-w*.09).rgb*.2;',
    ' s=s*mix(s,vec3(1.),.4)*1.05;',
    ' float f=fbm(uv*2.+w*3.+t);',
    ' vec3 c=mix(uC0,s,.45+.55*smoothstep(.2,.7,f));',
    ' c+=uC3*pow(smoothstep(.6,.9,f),3.)*.25;',
    ' gl_FragColor=vec4(fin(c,uv),1.);}'
  ].join('\n');

  var SCENES = [{ name: 'Nebula', src: NEBULA }, { name: 'Eclipse', src: ECLIPSE }, { name: 'Silk', src: SILK }, { name: 'Melt', src: MELT }];

  var glc = $('gl'), gl = null, tex = null, scale = 0.33, MAX_SCALE = 0.6;
  function initGL() {
    var opts = { antialias: false, alpha: false, depth: false, stencil: false, preserveDrawingBuffer: false, powerPreference: 'low-power' };
    gl = glc.getContext('webgl', opts) || glc.getContext('experimental-webgl', opts);
    if (!gl) { console.warn('No WebGL'); return; }
    function sh(type, src) {
      var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }
    var vs = sh(gl.VERTEX_SHADER, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}');
    SCENES.forEach(function (sc) {
      try {
        var pr = gl.createProgram();
        gl.attachShader(pr, vs); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, HEAD + '\n' + sc.src));
        gl.bindAttribLocation(pr, 0, 'p'); gl.linkProgram(pr);
        if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(pr));
        sc.prog = pr; sc.u = {};
        ['uR', 'uT', 'uFade', 'uPulse', 'uDim', 'uC0', 'uC1', 'uC2', 'uC3', 'uC4', 'uTex'].forEach(function (k) { sc.u[k] = gl.getUniformLocation(pr, k); });
      } catch (e) { sc.bad = true; console.error('Scene ' + sc.name + ' failed:', e.message || e); }
    });
    var b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE, new Uint8Array([8, 6, 12]));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
    setScale(scale);
  }
  function setScale(s) {
    scale = s;
    glc.width = Math.max(64, Math.round(innerWidth * s));
    glc.height = Math.max(36, Math.round(innerHeight * s));
    if (gl) gl.viewport(0, 0, glc.width, glc.height);
  }
  window.addEventListener('resize', function () { setScale(scale); });
  function uploadTex(canvas) {
    if (!gl || !canvas) return;
    gl.bindTexture(gl.TEXTURE_2D, tex);
    try { gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, canvas); } catch (e) { console.warn('texture upload failed', e); }
  }

  /* ---------- palette: k-means on a 40x40 thumbnail of the cover ---------- */
  function rgb2hsl(c) {
    var r = c[0], g = c[1], b = c[2], mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, h = 0, s = 0, d = mx - mn;
    if (d > 1e-5) {
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);

    }

  function hsl2rgb(h, s, l) {
    h = ((h % 1) + 1) % 1;
    function f(n) { var k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); }
    return [f(0), f(8), f(4)];

  function fallbackPalette(seed) {
    var hue = hashStr(seed || 'drift');
    return [hsl2rgb(hue, .5, .035), hsl2rgb(hue, .7, .5), hsl2rgb(hue + .08, .65, .45), hsl2rgb(hue - .1, .75, .55), hsl2rgb(hue + .45, .5, .45)];
  }
  function extractPalette(img) {
    var c = document.createElement('canvas'); c.width = c.height = 40;
    var x = c.getContext('2d'); x.drawImage(img, 0, 0, 40, 40);
    var d; try { d = x.getImageData(0, 0, 40, 40).data; } catch (e) { return null; } // tainted canvas
    var px = [], i, j, k;
    for (i = 0; i < d.length; i += 4) px.push([d[i] / 255, d[i + 1] / 255, d[i + 2] / 255]);
    var luma = function (p) { return p[0] * .299 + p[1] * .587 + p[2] * .114; };
    var sorted = px.slice().sort(function (a, b) { return luma(a) - luma(b); });
    var K = 6, cent = [];
    for (k = 0; k < K; k++) cent.push(sorted[Math.floor((k + .5) / K * sorted.length)].slice());
    var cnt = [];
    for (var it = 0; it < 8; it++) {
      var sum = []; cnt = [];
      for (k = 0; k < K; k++) { sum.push([0, 0, 0]); cnt.push(0); }
      for (i = 0; i < px.length; i++) {
        var best = 0, bd = 1e9;
        for (k = 0; k < K; k++) { var dr = px[i][0] - cent[k][0], dg = px[i][1] - cent[k][1], db = px[i][2] - cent[k][2], dd = dr * dr + dg * dg + db * db; if (dd < bd) { bd = dd; best = k; } }
        for (j = 0; j < 3; j++) sum[best][j] += px[i][j];
        cnt[best]++;
      }
      for (k = 0; k < K; k++) if (cnt[k]) for (j = 0; j < 3; j++) cent[k][j] = sum[k][j] / cnt[k];
    }
    var cl = cent.map(function (c, k) { var hsl = rgb2hsl(c); return { rgb: c, h: hsl[0], s: hsl[1], l: hsl[2], n: cnt[k] / px.length }; }).filter(function (c) { return c.n > 0; });
    var dark = cl.slice().sort(function (a, b) { return a.l - b.l; })[0];
    var base = hsl2rgb(dark.h, Math.min(dark.s, .6), .03);
    cl.forEach(function (c) { c.score = c.s * .7 + c.n * .6 + (c.l > .15 && c.l < .85 ? .15 : 0) - (c.l < .07 ? .6 : 0) - (c.l > .93 ? .3 : 0); });
    cl.sort(function (a, b) { return b.score - a.score; });
    var acc = [];
    cl.forEach(function (c) { if (acc.length < 4) acc.push(c); });
    var top = acc[0] || { h: hashStr('x'), s: .6 };
    var extra = [.09, -.09, .5, .25];
    for (i = 0; acc.length < 4; i++) acc.push({ h: top.h + extra[i], s: Math.max(top.s, .5), l: .5 });
    // monochrome covers: nudge the later accents apart in hue so scenes keep some depth

    var s = document.createElement('script'); s.src = 'https://sdk.scdn.co/spotify-player.js';
    s.onerror = function () { clearTimeout(to); speaker.state = 'fail'; speaker.msg = 'could not load the Spotify player'; };
    document.head.appendChild(s);
  }

  /* ---------- remote actions ---------- */
  function apiAction(promise) { return promise.then(function () { schedulePoll(700); }).catch(function (e) { toast(e.status === 404 ? 'No active Spotify device' : e.status === 403 ? 'Spotify said no' : 'Could not reach Spotify'); }); }
  function togglePlay() {
    if (DEMO) { demo.toggle(); return; }
    if (S.playing) { apiAction(api('PUT', '/me/player/pause')); toast('Pause'); return; }
    toast('Play');
    api('PUT', '/me/player/play').then(function () { schedulePoll(700); }).catch(function (e) {
      if (e.status === 404 && speaker.state === 'ready') apiAction(api('PUT', '/me/player', { device_ids: [speaker.id], play: true }));
      else toast(e.status === 404 ? 'No active Spotify device' : 'Could not reach Spotify');
    });
  }
  function skip(dir) {
    toast(dir > 0 ? 'Next' : 'Previous');
    if (DEMO) { demo.skip(dir); return; }
    apiAction(api('POST', dir > 0 ? '/me/player/next' : '/me/player/previous'));
  }

  /* ======================================================================
     Panel: setup + help (drifts too)
     ====================================================================== */
  var panelT = null;
  function setPanel(kind, html) {
    S.panel = kind; S.focus = 0;
    panel.innerHTML = html; panel.className = 'layer' + (kind ? ' on' : '');
    sizes.panel = [panel.offsetWidth, panel.offsetHeight];
    markFocus();
  }
  function markFocus() {
    var b = panel.querySelectorAll('.btn');
    for (var i = 0; i < b.length; i++) b[i].className = 'btn' + (i === S.focus ? ' focus' : '');
  }
  function showSetup(err) {
    var h = '<div class="k">drift · late-night specimen viewer</div><h1>Drift</h1>' +
      '<p>Slow visuals for whatever you play on Spotify. Nothing ever stands still, so your OLED stays healthy.</p>' +
      (err ? '<p class="err">' + esc(err) + '</p>' : '');
    if (!cid) {
      h += '<p>Paste your Spotify app’s Client ID:</p><input id="cidIn" class="mono" placeholder="client id" spellcheck="false">' +
        '<div class="m" style="margin-top:.8em">Redirect URI to add in the Spotify dashboard:<br>' + esc(REDIRECT) + '</div>' +
        '<span class="btn" data-act="savecid">Save</span><span class="btn" data-act="demo">Watch demo</span>';
    } else if (!window.crypto || !crypto.subtle) {
      h += '<span class="btn" data-act="login">Connect Spotify</span><span class="btn" data-act="demo">Watch demo</span>';
    } else {
      h += '<div class="qrwrap"><canvas id="qr" width="33" height="33"></canvas>' +
        '<div><p style="margin:0">Scan with your phone and log in to Spotify there. This screen connects by itself.</p>' +
        '<div class="m" id="qrStatus" style="margin-top:.5em">waiting for your phone…</div></div></div>' +
        '<span class="btn" data-act="login">Log in on this TV instead</span><span class="btn" data-act="demo">Watch demo</span>';
    }
    setPanel('setup', h);
    if (cid && $('qr')) { drawPairQR(); startPairPolling(); }
  }

  /* ======================================================================
     Phone pairing: the TV shows a QR code, the phone logs in to Spotify and
     hands the tokens over, AES-encrypted, through a public relay (ntfy.sh).
     The key only lives in the QR code, so the relay never sees the tokens.
     ====================================================================== */
  var RELAY = 'https://ntfy.sh/';
  function alnum(n) { var cs = 'abcdefghijklmnopqrstuvwxyz0123456789', a = new Uint8Array(n), s = ''; crypto.getRandomValues(a); for (var i = 0; i < n; i++) s += cs[a[i] % cs.length]; return s; }
  function unb64url(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function aesKey(keyStr, use) { return crypto.subtle.importKey('raw', unb64url(keyStr), { name: 'AES-GCM' }, false, [use]); }
  function seal(keyStr, obj) {
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return aesKey(keyStr, 'encrypt').then(function (k) { return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, k, new TextEncoder().encode(JSON.stringify(obj))); })
      .then(function (ct) { return b64url(iv) + '.' + b64url(ct); });
  }
  function unseal(keyStr, msg) {
    var p = msg.split('.');
    return aesKey(keyStr, 'decrypt').then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64url(p[0]) }, k, unb64url(p[1])); })
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function pairCode() {
    var p = LS.get('pair');
    if (!p) { p = alnum(24) + '.' + b64url(crypto.getRandomValues(new Uint8Array(16))); LS.set('pair', p); }
    return p;
  }
  var qrLib = null;
  function drawPairQR() {
    var url = REDIRECT + '?pair=' + pairCode();
    function draw() {
      var c = $('qr'); if (!c || !window.qrcode) return;
      var q = window.qrcode(0, 'M'); q.addData(url); q.make();
      var n = q.getModuleCount(), m = 2; c.width = c.height = n + m * 2;
      var x = c.getContext('2d'); x.fillStyle = '#b9b1c6'; x.fillRect(0, 0, c.width, c.height); x.fillStyle = '#07050b';
      for (var r = 0; r < n; r++) for (var cc = 0; cc < n; cc++) if (q.isDark(r, cc)) x.fillRect(cc + m, r + m, 1, 1);
    }
    if (window.qrcode) return draw();
    if (!qrLib) {
      qrLib = document.createElement('script');
      qrLib.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
      qrLib.onerror = function () { var s = $('qrStatus'); if (s) s.textContent = 'QR failed to load. Use "Log in on this TV".'; };
      document.head.appendChild(qrLib);
    }
    qrLib.addEventListener('load', draw);
  }
  var pairTimer = null;
  function stopPairPolling() { clearInterval(pairTimer); pairTimer = null; }
  function startPairPolling() {
    if (pairTimer) return;
    var parts = pairCode().split('.'), busy = false;
    pairTimer = setInterval(function () {
      if (busy || S.panel !== 'setup') return;
      busy = true;
      fetch(RELAY + 'drift-' + parts[0] + '/json?poll=1').then(function (r) { return r.text(); }).then(function (txt) {
        var lines = txt.trim().split('\n'), msg = null;
        for (var i = lines.length - 1; i >= 0 && !msg; i--) { try { var m = JSON.parse(lines[i]); if (m.event === 'message' && m.message) msg = m.message; } catch (e) {} }
        if (!msg) return;
        return unseal(parts[1], msg).then(function (d) {
          if (!d || !d.refresh) return;
          stopPairPolling(); LS.del('pair');
          saveTok({ access_token: d.access, refresh_token: d.refresh, expires_in: Math.max(60, Math.round((d.exp - Date.now()) / 1000)), scope: d.scope });
          start(true);
        });
      }).catch(function () {}).then(function () { busy = false; });
    }, 3000);
  }
  // phone side: after logging in, send the tokens to the TV and forget them here
  function sendPair(pair) {
    var parts = pair.split('.');
    setPanel('setup', '<div class="k">drift · pairing</div><h1>Sending…</h1><p>Handing your login to the TV.</p>');
    return seal(parts[1], { access: tok.access, refresh: tok.refresh, exp: tok.exp, scope: LS.get('scope') || '' })
      .then(function (msg) { return fetch(RELAY + 'drift-' + parts[0], { method: 'POST', body: msg }); })
      .then(function (r) {
        if (!r.ok) throw new Error('relay said ' + r.status);
        LS.del('pairsend'); logout();
        setPanel('setup', '<div class="k">drift · pairing</div><h1>Done.</h1><p>Look at your TV, it connects within a few seconds. You can close this page.</p>');
      })
      .catch(function (e) {
        setPanel('setup', '<div class="k">drift · pairing</div><h1>Hmm.</h1><p class="err">Could not reach the TV: ' + esc(e.message || e) + '</p><span class="btn" data-act="resend">Try again</span>');
      });
  }
  function helpHTML() {
    var sp = speaker.state === 'ready' ? 'ready — pick “Drift” in Spotify on your phone'
      : speaker.state === 'loading' ? 'starting…'
      : speaker.state === 'fail' ? 'not available here (' + speaker.msg + ')'
      : speaker.state === 'offline' ? 'offline' : (speaker.msg || 'off');
    return '<div class="k">drift · remote</div><h1>Controls</h1><table>' +
      '<tr><td>OK</td><td>play / pause</td></tr>' +
      '<tr><td>◀ ▶</td><td>change scene (' + esc(SCENES[S.scene].name) + ')</td></tr>' +
      '<tr><td>▲ ▼</td><td>brightness (' + Math.round(S.userDim * 100) + '%)</td></tr>' +
      '<tr><td>RED</td><td>hide / show the card</td></tr>' +
      '<tr><td>GREEN</td><td>lyrics on / off</td></tr>' +
      '<tr><td>YELLOW · BLUE</td><td>previous · next track</td></tr>' +
      '<tr><td>INFO</td><td>this help</td></tr></table>' +
      '<div class="m" style="margin-top:.8em">speaker: ' + esc(sp) + '<br>render ' + Math.round(scale * 100) + '% · ' + Math.round(fpsNow) + ' fps' +
      (DEMO ? ' · demo mode' : '') + '</div>';
  }
  function showHelp(ms) {
    setPanel('help', helpHTML());
    clearTimeout(panelT); panelT = setTimeout(function () { if (S.panel === 'help') setPanel(null, ''); }, ms || 12000);
  }
  function refreshPanel() { if (S.panel === 'help') { panel.innerHTML = helpHTML(); } }
  function panelAct(act) {
    if (act === 'login') login();
    else if (act === 'demo') { location.href = REDIRECT + '?demo'; }
    else if (act === 'resend') { var ps = LS.get('pairsend'); if (ps && tok.refresh) sendPair(ps); else login(); }
    else if (act === 'savecid') {
      var v = ($('cidIn') && $('cidIn').value || '').trim();
      if (!/^[0-9a-f]{32}$/i.test(v)) { showSetup('That doesn’t look like a Client ID (32 letters/numbers).'); return; }
      LS.set('cid', v); cid = v; showSetup();
    }
  }
  panel.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== panel && !(el.getAttribute && el.getAttribute('data-act'))) el = el.parentNode;
    if (el && el !== panel) { e.stopPropagation(); panelAct(el.getAttribute('data-act')); }
  });

  /* ======================================================================
     Input: LG Magic Remote + keyboard
     ====================================================================== */
  var firstGesture = true;
  function onGesture() {
    keepPlay();
    if (firstGesture) {
      firstGesture = false;
      var el = document.documentElement, f = el.requestFullscreen || el.webkitRequestFullscreen;
      if (f && !(document.fullscreenElement || document.webkitFullscreenElement)) { try { var p = f.call(el); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
    }
    if (player && player.activateElement) { try { player.activateElement(); } catch (e) {} }
  }
  document.addEventListener('keydown', function (e) {
    var c = e.keyCode, key = (e.key || '').toLowerCase();
    var typing = document.activeElement && document.activeElement.tagName === 'INPUT';
    onGesture();
    if (S.panel === 'setup') {
      var n = panel.querySelectorAll('.btn').length;
      if (typing && c !== 13 && c !== 40 && c !== 38) return;
      if (c === 37 || c === 38) { S.focus = (S.focus + n - 1) % n; markFocus(); if (typing) document.activeElement.blur(); e.preventDefault(); }
      else if (c === 39 || c === 40) { S.focus = (S.focus + 1) % n; markFocus(); if (typing) document.activeElement.blur(); e.preventDefault(); }
      else if (c === 13) { var b = panel.querySelectorAll('.btn')[S.focus]; if (b) panelAct(b.getAttribute('data-act')); e.preventDefault(); }
      return;
    }
    if (typing) return;
    var handled = true;
    if (c === 13 || c === 32 || c === 415 || c === 19) togglePlay();
    else if (c === 37) goScene((S.switching ? S.pending : S.scene) - 1);
    else if (c === 39) goScene((S.switching ? S.pending : S.scene) + 1);
    else if (c === 38 || c === 40) {
      S.userDim = clamp(Math.round((S.userDim + (c === 38 ? 0.15 : -0.15)) * 100) / 100, 0.25, 1);
      LS.set('dim', S.userDim); toast('Brightness ' + Math.round(S.userDim * 100) + '%');
    }
    else if (c === 403 || key === 'c') { S.showCard = !S.showCard; LS.set('card', S.showCard ? '1' : '0'); updateCardVis(); toast(S.showCard ? 'Card on' : 'Card off'); }
    else if (c === 404 || key === 'l') { S.showLyrics = !S.showLyrics; LS.set('lyrics', S.showLyrics ? '1' : '0'); toast(S.showLyrics ? 'Lyrics on' : 'Lyrics off'); }
    else if (c === 405 || key === 'p' || c === 412) skip(-1);
    else if (c === 406 || key === 'n' || c === 417) skip(1);
    else if (c === 457 || key === 'h' || key === 'i') { if (S.panel === 'help') setPanel(null, ''); else showHelp(); }
    else if (c === 461 || c === 27) { if (S.panel) setPanel(null, ''); else handled = false; }
    else if (key === 'f') onGesture();
    else handled = false;
    if (handled) e.preventDefault();
  });
  var curT = null;
  document.addEventListener('mousemove', function () {
    document.body.className = 'pointer'; clearTimeout(curT);
    curT = setTimeout(function () { document.body.className = ''; }, 3000);
  });
  document.addEventListener('click', function () { onGesture(); });

  /* ======================================================================
     Demo mode: invented tracks + generated covers (no Spotify needed)
     ====================================================================== */
  var demo = (function () {
    var TR = [
      { title: 'Velvet Static', artist: 'Low Orbit Choir', album: 'Night Bus Liturgy', year: '2019', hue: .78, genres: ['dream pop', 'slowcore'],
        words: ['the bus is warm and nobody talks', 'orange lights count us down', '', 'I left my name on the window', 'it fogged and it was gone', 'velvet static in my teeth', '', 'say it slower', 'say it like the radio'] },
      { title: 'Saltwater Cathedral', artist: 'Mirela & the Undertow', album: 'Pressure Hymns', year: '2022', hue: .52, genres: ['ambient techno'],
        words: ['down here the bells are quiet', 'blue as a closed eye', '', 'we build rooms out of echo', 'and live in them for a while', '', 'hold your breath', 'hold it like a secret'] },
      { title: 'Ember Index', artist: 'KAIROS 9', album: 'Heat Death (Deluxe)', year: '2017', hue: .03, genres: ['darkwave', 'industrial'],
        words: ['every lamp in the city', 'counting backwards', '', 'feed the fire a little louder', 'it remembers what we said', '', 'ember, ember', 'index of the dark'] },
      { title: 'Moss Telephone', artist: 'Juniper Ghostline', album: 'Green Room Static', year: '2024', hue: .3, genres: ['psych folk'],
        words: ['ring once if you can hear me', 'ring twice if you are the forest', '', 'the line is soft and slow', 'something growing in the wires', '', 'hello', 'hello from under the leaves'] }
    ];
    var DUR = 80000, i = 0, start = Date.now(), pausedAt = 0, playing = true;
    function rnd(seed) { return function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
    function cover(tr, k) {
      var c = document.createElement('canvas'); c.width = c.height = 320; var x = c.getContext('2d'), r = rnd(k * 7919 + 13);
      function hsl(h, s, l, a) { return 'hsla(' + Math.round(((h % 1) + 1) % 1 * 360) + ',' + Math.round(s * 100) + '%,' + Math.round(l * 100) + '%,' + a + ')'; }
      x.fillStyle = hsl(tr.hue, .5, .07, 1); x.fillRect(0, 0, 320, 320);
      for (var n = 0; n < 7; n++) {
        var cx = r() * 320, cy = r() * 320, rad = 60 + r() * 170, g = x.createRadialGradient(cx, cy, 0, cx, cy, rad);
        g.addColorStop(0, hsl(tr.hue + (r() - .5) * .25, .7, .35 + r() * .3, .9)); g.addColorStop(1, hsl(tr.hue, .6, .2, 0));
        x.fillStyle = g; x.fillRect(0, 0, 320, 320);
      }
      x.strokeStyle = hsl(tr.hue + .5, .6, .7, .5); x.lineWidth = 2;
      x.beginPath(); x.arc(160 + (r() - .5) * 80, 160 + (r() - .5) * 80, 40 + r() * 70, 0, TAU); x.stroke();
      for (n = 0; n < 9; n++) { x.fillStyle = hsl(tr.hue + .45, .5, .8, .07); x.fillRect(0, r() * 320, 320, 1 + r() * 3); }
      return c.toDataURL('image/jpeg', .9);
    }
    TR.forEach(function (tr, k) {
      tr.cover = cover(tr, k + 1); tr.id = 'demo' + k; tr.duration = DUR; tr.isEpisode = false;
      tr.lyrics = tr.words.map(function (w, j) { return { t: 3000 + j * 7000, text: w }; });
    });
    function pos() { return playing ? Date.now() - start : pausedAt; }
    function push() {
      if (pos() >= DUR) { i = (i + 1) % TR.length; start = Date.now(); }
      var tr = TR[i];
      S.progress = pos(); S.fetchedAt = Date.now(); S.duration = DUR; S.playing = playing;
      if (!S.track || S.track.id !== tr.id) { S.track = tr; onTrack(tr); }
      setMode(playing ? 'playing' : 'paused');
    }
    return {
      start: function () { push(); setInterval(push, 1000); },
      toggle: function () { if (playing) { pausedAt = pos(); playing = false; } else { start = Date.now() - pausedAt; playing = true; } toast(playing ? 'Play' : 'Pause'); push(); },
      skip: function (d) { i = (i + d + TR.length) % TR.length; start = Date.now(); playing = true; push(); }
    };
  })();

  /* ======================================================================
     Boot
     ====================================================================== */
  initGL();
  S.pending = S.scene; S.fade = 0;
  requestAnimationFrame(frame);
  keepPlay();

  function boot() {
    if (DEMO) { demo.start(); showHelp(9000); return; }
    var code = Q.get('code'), err = Q.get('error'), pair = Q.get('pair');
    if (code || err || pair || Q.has('cid') || Q.has('reset')) history.replaceState(null, '', REDIRECT);
    if (pair && /^[a-z0-9]{24}\.[A-Za-z0-9_-]{22}$/.test(pair)) {
      // phone arrived from the TV's QR code: log in to Spotify here, then hand over
      LS.set('pairsend', pair);
      setPanel('setup', '<div class="k">drift · pairing</div><h1>Hi, phone.</h1><p>Log in to Spotify and your TV connects by itself.</p>' +
        '<span class="btn" data-act="login">Log in with Spotify</span>');
      return;
    }
    if (err) { LS.del('pairsend'); showSetup('Spotify said: ' + err); return; }
    if (code) {
      if (Q.get('state') !== LS.get('state')) { showSetup('Login check failed (state mismatch). Try again.'); return; }
      tokenReq({ grant_type: 'authorization_code', code: code, redirect_uri: REDIRECT, client_id: cid, code_verifier: LS.get('pkce') || '' })
        .then(function (d) {
          saveTok(d); LS.del('pkce'); LS.del('state');
          var ps = LS.get('pairsend');
          if (ps) sendPair(ps); else start(true);
        })
        .catch(function (e) { showSetup('Login failed: ' + e.message); });
      return;
    }
    if (tok.refresh && cid) start(false); else showSetup();
  }
  function start(fresh) {
    stopPairPolling();
    setPanel(null, '');
    poll();
    startSpeaker();
    if (fresh) showHelp(15000);
  }
  boot();
})();
</script>
</body>
</html>
